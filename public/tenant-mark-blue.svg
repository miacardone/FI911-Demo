<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" role="img" aria-label="Fi911">
<rect x="0" y="6" width="100" height="100" rx="15" fill="#00A9BB" />

    <!-- Horns: filled crescents that taper to a point. Drawn as strokes they
         read as antennae — a horn is thick where it meets the skull. -->
    <path d="M36 46C27 37 18 31 9 28c2 11 10 21 21 27z" fill="#FFFFFF" />
    <path d="M64 46c9-9 18-15 27-18-2 11-10 21-21 27z" fill="#FFFFFF" />

    <!-- Ears -->
    <ellipse cx="24" cy="55" rx="9.5" ry="6" fill="#FFFFFF" transform="rotate(-22 24 55)" />
    <ellipse cx="76" cy="55" rx="9.5" ry="6" fill="#FFFFFF" transform="rotate(22 76 55)" />

    <!-- Head -->
    <path d="M50 36c13 0 23 9.5 23 22 0 15-9 27.5-23 31.5C36 85.5 27 73 27 58c0-12.5 10-22 23-22z" fill="#FFFFFF" />

    <!-- Eyes and muzzle punched back out in teal -->
    <ellipse cx="41" cy="57" rx="4.6" ry="5.6" fill="#00A9BB" />
    <ellipse cx="59" cy="57" rx="4.6" ry="5.6" fill="#00A9BB" />
    <ellipse cx="50" cy="77" rx="9.5" ry="6.5" fill="#00A9BB" />
</svg>
